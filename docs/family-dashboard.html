<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭控制台</title>
<style>
:root {
  --bg: #1a1a2e;
  --card: #16213e;
  --card2: #0f3460;
  --border: rgba(255,255,255,0.1);
  --text: #e2e8f0;
  --text-muted: #8892a4;
  --accent-red: #e94560;
  --accent-cyan: #00b4d8;
  --accent-orange: #f5a623;
  --accent-green: #4caf50;
  --accent-purple: #ce93d8;
  --accent-blue: #4fc3f7;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Noto Sans TC','PingFang TC',sans-serif; min-height:100vh; display:flex; flex-direction:column; }

header { background:#0d1b2a; padding:0 24px; display:flex; align-items:center; gap:16px; height:52px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
.logo-badge { background:var(--accent-red); color:#fff; font-weight:800; font-size:13px; padding:3px 10px; border-radius:4px; letter-spacing:.5px; }
.logo-sub { font-size:13px; color:rgba(255,255,255,.5); }
.header-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
.last-updated { font-size:12px; color:rgba(255,255,255,.4); background:rgba(255,255,255,.06); padding:4px 10px; border-radius:20px; border:1px solid rgba(255,255,255,.08); }
.btn-ghost { padding:6px 14px; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; background:rgba(255,255,255,.08); color:rgba(255,255,255,.75); border:1px solid rgba(255,255,255,.12); font-family:inherit; transition:all .15s; }
.btn-ghost:hover { background:rgba(255,255,255,.14); color:#fff; }

.tabs { background:#0d1b2a; border-bottom:1px solid var(--border); padding:0 24px; display:flex; }
.tab { padding:13px 18px; font-size:13px; font-weight:500; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all .15s; user-select:none; white-space:nowrap; }
.tab:hover { color:var(--text); }
.tab.active { color:var(--accent-cyan); border-bottom-color:var(--accent-cyan); font-weight:700; }

.tab-content { display:none; flex:1; overflow-y:auto; }
.tab-content.active { display:block; }
.content-wrap { padding:20px 24px 48px; max-width:960px; }

/* Stats */
.stats-row { display:flex; gap:12px; margin-bottom:20px; }
.stat-card { flex:1; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px; text-align:center; }
.stat-num { font-size:28px; font-weight:700; line-height:1; }
.stat-label { font-size:11px; color:var(--text-muted); margin-top:5px; }
.stat-card.pending .stat-num { color:var(--accent-orange); }
.stat-card.done .stat-num { color:var(--accent-cyan); }
.stat-card.overdue .stat-num { color:var(--accent-red); }

/* Filter */
.filter-row { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.filter-btn { padding:5px 14px; border-radius:20px; font-size:12px; font-weight:500; cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--text-muted); transition:all .15s; font-family:inherit; }
.filter-btn:hover { color:var(--text); border-color:rgba(255,255,255,.3); }
.filter-btn.active { background:var(--accent-cyan); color:#0d1b2a; border-color:var(--accent-cyan); font-weight:700; }

/* Task list */
#task-list { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; min-height:8px; }
.task-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; display:flex; align-items:center; gap:12px; transition:opacity .15s; }
.task-card.done-card { opacity:0.5; }
.task-check { width:20px; height:20px; border-radius:50%; border:2px solid var(--text-muted); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s; }
.task-check.checked { background:var(--accent-cyan); border-color:var(--accent-cyan); }
.task-check.checked::after { content:'✓'; color:#0d1b2a; font-size:12px; font-weight:700; }
.task-body { flex:1; min-width:0; }
.task-title { font-size:14px; font-weight:500; color:var(--text); }
.task-card.done-card .task-title { text-decoration:line-through; color:var(--text-muted); }
.task-meta { display:flex; align-items:center; gap:8px; margin-top:5px; flex-wrap:wrap; }
.tag { font-size:11px; padding:2px 8px; border-radius:10px; font-weight:600; }
.tag-cat-規劃    { background:rgba(79,195,247,.15); color:var(--accent-blue); }
.tag-cat-成員    { background:rgba(206,147,216,.15); color:var(--accent-purple); }
.tag-cat-日常習慣 { background:rgba(76,175,80,.15);  color:var(--accent-green); }
.tag-pri-high    { background:rgba(233,69,96,.15); color:var(--accent-red); }
.tag-pri-medium  { background:rgba(245,166,35,.15); color:var(--accent-orange); }
.tag-pri-low     { background:rgba(76,175,80,.15); color:var(--accent-green); }
.task-due { font-size:11px; color:var(--text-muted); }
.task-due.overdue { color:var(--accent-red); font-weight:600; }
.task-del { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:16px; padding:2px 6px; border-radius:4px; transition:all .15s; flex-shrink:0; }
.task-del:hover { color:var(--accent-red); background:rgba(233,69,96,.1); }
.empty-hint { color:var(--text-muted); font-size:13px; padding:16px 0; text-align:center; }

/* Add task form */
.add-task-form { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
.form-section-title { font-size:13px; font-weight:600; color:var(--text-muted); margin-bottom:12px; }
.form-row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
.form-group { display:flex; flex-direction:column; gap:5px; }
.form-group.flex1 { flex:1; min-width:160px; }
.form-label { font-size:11px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
.form-input, .form-select { background:#0d1b2a; border:1.5px solid var(--border); border-radius:6px; color:var(--text); font-size:13px; padding:7px 10px; font-family:inherit; transition:border-color .15s; }
.form-input:focus, .form-select:focus { outline:none; border-color:var(--accent-cyan); }
.form-select option { background:#0d1b2a; }
.form-input[type="date"] { color-scheme:dark; }
.btn-add { background:var(--accent-cyan); color:#0d1b2a; font-weight:700; padding:8px 18px; border-radius:6px; border:none; cursor:pointer; font-family:inherit; font-size:13px; align-self:flex-end; white-space:nowrap; transition:filter .15s; }
.btn-add:hover { filter:brightness(1.1); }

/* Member cards */
.member-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; margin-bottom:12px; }
.member-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.member-emoji { font-size:22px; }
.member-name { font-size:15px; font-weight:700; }
.member-role { font-size:12px; color:var(--text-muted); margin-top:2px; }
.form-textarea { width:100%; background:#0d1b2a; border:1.5px solid var(--border); border-radius:6px; color:var(--text); font-size:13px; padding:8px 10px; font-family:inherit; line-height:1.55; resize:vertical; min-height:80px; transition:border-color .15s; }
.form-textarea:focus { outline:none; border-color:var(--accent-cyan); }

/* Save buttons */
.save-btn { background:var(--accent-cyan); color:#0d1b2a; font-weight:700; padding:9px 24px; border-radius:6px; border:none; cursor:pointer; font-family:inherit; font-size:14px; margin-top:16px; transition:filter .15s; }
.save-btn:hover { filter:brightness(1.1); }
.save-btn:disabled { opacity:0.6; cursor:not-allowed; filter:none; }

/* Habits */
.habit-list { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
.habit-item { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; display:flex; align-items:center; gap:12px; }
.habit-check { width:18px; height:18px; border-radius:3px; cursor:pointer; accent-color:var(--accent-cyan); flex-shrink:0; }
.habit-body { flex:1; }
.habit-title { font-size:14px; font-weight:500; }
.habit-freq { font-size:11px; color:var(--text-muted); margin-top:3px; }
.habit-del { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:15px; padding:2px 6px; border-radius:4px; transition:all .15s; flex-shrink:0; }
.habit-del:hover { color:var(--accent-red); background:rgba(233,69,96,.1); }

/* Toast */
.toast { position:fixed; bottom:24px; right:24px; padding:11px 18px; border-radius:7px; font-size:13px; font-weight:600; opacity:0; transform:translateY(10px); transition:all .22s; pointer-events:none; z-index:999; }
.toast.show { opacity:1; transform:translateY(0); }
.toast-success { background:#1b5e20; color:#a5d6a7; border:1px solid #2e7d32; }
.toast-error { background:#7f1d1d; color:#fca5a5; border:1px solid #b91c1c; }

::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,.15); border-radius:3px; }
</style>
</head>
<body>

<header>
  <div class="logo-badge">家</div>
  <div class="logo-sub">家庭控制台</div>
  <div class="header-right">
    <span class="last-updated" id="lastUpdated">載入中…</span>
    <button class="btn-ghost" id="refreshBtn">↺ 重新整理</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="tasks">✅ 任務清單</div>
  <div class="tab" data-tab="members">👨‍👩‍👧‍👦 成員</div>
  <div class="tab" data-tab="habits">📅 日常習慣</div>
</div>

<!-- 任務清單 -->
<div class="tab-content active" id="tab-tasks">
  <div class="content-wrap">
    <div class="stats-row">
      <div class="stat-card pending">
        <div class="stat-num" id="stat-pending">0</div>
        <div class="stat-label">待辦</div>
      </div>
      <div class="stat-card done">
        <div class="stat-num" id="stat-done">0</div>
        <div class="stat-label">已完成</div>
      </div>
      <div class="stat-card overdue">
        <div class="stat-num" id="stat-overdue">0</div>
        <div class="stat-label">逾期</div>
      </div>
    </div>

    <div class="filter-row">
      <button class="filter-btn active" data-filter="全部">全部</button>
      <button class="filter-btn" data-filter="規劃">規劃</button>
      <button class="filter-btn" data-filter="成員">成員</button>
      <button class="filter-btn" data-filter="日常習慣">日常習慣</button>
      <button class="filter-btn" data-filter="未完成">未完成</button>
    </div>

    <div id="task-list"></div>

    <div class="add-task-form">
      <div class="form-section-title">＋ 新增任務</div>
      <div class="form-row">
        <div class="form-group flex1">
          <label class="form-label">標題</label>
          <input class="form-input" id="new-title" placeholder="任務內容…">
        </div>
        <div class="form-group">
          <label class="form-label">分類</label>
          <select class="form-select" id="new-cat">
            <option value="規劃">規劃</option>
            <option value="成員">成員</option>
            <option value="日常習慣">日常習慣</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">優先級</label>
          <select class="form-select" id="new-pri">
            <option value="high">🔴 高</option>
            <option value="medium" selected>🟡 中</option>
            <option value="low">🟢 低</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">到期日</label>
          <input class="form-input" type="date" id="new-due">
        </div>
        <button class="btn-add" id="addTaskBtn">新增</button>
      </div>
    </div>
  </div>
</div>

<!-- 成員 -->
<div class="tab-content" id="tab-members">
  <div class="content-wrap">
    <div id="member-cards"></div>
    <button class="save-btn" id="saveMembersBtn">儲存成員備註</button>
  </div>
</div>

<!-- 日常習慣 -->
<div class="tab-content" id="tab-habits">
  <div class="content-wrap">
    <div id="habit-list" class="habit-list"></div>
    <div class="add-task-form" style="margin-bottom:12px">
      <div class="form-section-title">＋ 新增習慣</div>
      <div class="form-row">
        <div class="form-group flex1">
          <label class="form-label">習慣名稱</label>
          <input class="form-input" id="new-habit-title" placeholder="習慣名稱…">
        </div>
        <div class="form-group" style="min-width:180px">
          <label class="form-label">頻率</label>
          <input class="form-input" id="new-habit-freq" placeholder="例：每週一、每週末">
        </div>
        <button class="btn-add" id="addHabitBtn">新增</button>
      </div>
    </div>
    <button class="save-btn" id="saveHabitsBtn">儲存習慣</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var API = 'https://telegram-bot-t82n.onrender.com';
var SECRET = '950157secret';
var HEADERS = { 'Content-Type': 'application/json', 'X-Secret': SECRET };
var GET_HEADERS = { 'X-Secret': SECRET, 'Cache-Control': 'no-store' };

var familyData = {};
var currentFilter = '全部';
var today = new Date().toISOString().slice(0, 10);

var DEFAULT_HABITS = [
  { title: '週一 佳音英文接送（國一）', freq: '每週一' },
  { title: '週四 佳音英文接送（國一）', freq: '每週四' },
  { title: '假日切換忠孝路', freq: '每週末' }
];

var MEMBERS = [
  { key: 'wife',    emoji: '👩', name: '老婆',   role: '家庭核心' },
  { key: 'child_1', emoji: '👦', name: '大寶',   role: '國三・2026 會考' },
  { key: 'child_2', emoji: '👧', name: '小寶',   role: '國一・佳音英文週一/四' },
  { key: 'father',  emoji: '👴', name: '父親',   role: '長輩' },
  { key: 'mother',  emoji: '👵', name: '母親',   role: '長輩' }
];

var PRI_LABEL = { high: '🔴 高', medium: '🟡 中', low: '🟢 低' };
var PRI_ORDER = { high: 0, medium: 1, low: 2 };

// ── Tabs ──
document.querySelectorAll('.tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// ── Toast ──
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show toast-' + (type || 'success');
  setTimeout(function() { t.className = 'toast'; }, 2200);
}

// ── Escape HTML ──
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Sort tasks ──
function sortTasks(tasks) {
  return tasks.slice().sort(function(a, b) {
    if (a.done !== b.done) return a.done ? 1 : -1;
    var pa = PRI_ORDER[a.priority] !== undefined ? PRI_ORDER[a.priority] : 1;
    var pb = PRI_ORDER[b.priority] !== undefined ? PRI_ORDER[b.priority] : 1;
    if (pa !== pb) return pa - pb;
    if (a.due && b.due) return a.due < b.due ? -1 : 1;
    if (a.due) return -1;
    if (b.due) return 1;
    return 0;
  });
}

// ── Render tasks ──
function renderTasks() {
  var tasks = familyData._family_tasks || [];
  var pending = tasks.filter(function(t) { return !t.done; }).length;
  var done    = tasks.filter(function(t) { return t.done; }).length;
  var overdue = tasks.filter(function(t) { return !t.done && t.due && t.due < today; }).length;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-done').textContent    = done;
  document.getElementById('stat-overdue').textContent = overdue;

  var filtered = tasks;
  if (currentFilter === '未完成') {
    filtered = tasks.filter(function(t) { return !t.done; });
  } else if (currentFilter !== '全部') {
    filtered = tasks.filter(function(t) { return t.category === currentFilter; });
  }
  filtered = sortTasks(filtered);

  var list = document.getElementById('task-list');
  list.innerHTML = '';

  if (filtered.length === 0) {
    var hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = '沒有符合條件的任務';
    list.appendChild(hint);
    return;
  }

  filtered.forEach(function(task) {
    var card = document.createElement('div');
    card.className = 'task-card' + (task.done ? ' done-card' : '');

    var check = document.createElement('div');
    check.className = 'task-check' + (task.done ? ' checked' : '');
    check.addEventListener('click', function() { toggleTask(task.id); });

    var body = document.createElement('div');
    body.className = 'task-body';

    var titleEl = document.createElement('div');
    titleEl.className = 'task-title';
    titleEl.textContent = task.title;

    var meta = document.createElement('div');
    meta.className = 'task-meta';

    var catTag = document.createElement('span');
    catTag.className = 'tag tag-cat-' + (task.category || '');
    catTag.textContent = task.category || '';

    var priTag = document.createElement('span');
    priTag.className = 'tag tag-pri-' + (task.priority || 'medium');
    priTag.textContent = PRI_LABEL[task.priority] || task.priority || '';

    meta.appendChild(catTag);
    meta.appendChild(priTag);

    if (task.due) {
      var isOverdue = !task.done && task.due < today;
      var dueEl = document.createElement('span');
      dueEl.className = 'task-due' + (isOverdue ? ' overdue' : '');
      dueEl.textContent = (isOverdue ? '⚠️ ' : '') + task.due;
      meta.appendChild(dueEl);
    }

    body.appendChild(titleEl);
    body.appendChild(meta);

    var del = document.createElement('button');
    del.className = 'task-del';
    del.textContent = '✕';
    del.title = '刪除';
    del.addEventListener('click', function() { deleteTask(task.id); });

    card.appendChild(check);
    card.appendChild(body);
    card.appendChild(del);
    list.appendChild(card);
  });
}

// ── Toggle task ──
function toggleTask(id) {
  var tasks = familyData._family_tasks || [];
  var task = null;
  for (var i = 0; i < tasks.length; i++) { if (tasks[i].id === id) { task = tasks[i]; break; } }
  if (!task) return;
  task.done = !task.done;
  renderTasks();
  saveData(null);
}

// ── Delete task ──
function deleteTask(id) {
  familyData._family_tasks = (familyData._family_tasks || []).filter(function(t) { return t.id !== id; });
  renderTasks();
  saveData(null);
}

// ── Add task ──
document.getElementById('addTaskBtn').addEventListener('click', function() {
  var title = document.getElementById('new-title').value.trim();
  if (!title) { showToast('請輸入任務標題', 'error'); return; }
  var task = {
    id: 'fam_' + Date.now(),
    title: title,
    category: document.getElementById('new-cat').value,
    priority: document.getElementById('new-pri').value,
    due: document.getElementById('new-due').value || null,
    done: false
  };
  if (!familyData._family_tasks) familyData._family_tasks = [];
  familyData._family_tasks.push(task);
  document.getElementById('new-title').value = '';
  document.getElementById('new-due').value = '';
  renderTasks();
  saveData(null);
});

// ── Enter key in title field ──
document.getElementById('new-title').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('addTaskBtn').click();
});

// ── Filter buttons ──
document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTasks();
  });
});

// ── Render members ──
function renderMembers() {
  var container = document.getElementById('member-cards');
  container.innerHTML = '';
  MEMBERS.forEach(function(m) {
    var notes = '';
    if (familyData.members && familyData.members[m.key]) {
      notes = familyData.members[m.key].notes || '';
    }
    var card = document.createElement('div');
    card.className = 'member-card';
    card.innerHTML =
      '<div class="member-header">' +
        '<div class="member-emoji">' + m.emoji + '</div>' +
        '<div>' +
          '<div class="member-name">' + esc(m.name) + '</div>' +
          '<div class="member-role">' + esc(m.role) + '</div>' +
        '</div>' +
      '</div>' +
      '<textarea class="form-textarea" id="member-' + m.key + '" placeholder="備注…"></textarea>';
    container.appendChild(card);
    document.getElementById('member-' + m.key).value = notes;
  });
}

// ── Save members ──
document.getElementById('saveMembersBtn').addEventListener('click', function() {
  if (!familyData.members) familyData.members = {};
  MEMBERS.forEach(function(m) {
    if (!familyData.members[m.key]) familyData.members[m.key] = {};
    familyData.members[m.key].notes = document.getElementById('member-' + m.key).value;
  });
  var btn = document.getElementById('saveMembersBtn');
  btn.disabled = true;
  saveData('members', function() { btn.disabled = false; });
});

// ── Render habits ──
function renderHabits() {
  var habits = familyData._family_habits || [];
  var list = document.getElementById('habit-list');
  list.innerHTML = '';
  if (habits.length === 0) {
    var hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = '尚無習慣，從下方新增';
    list.appendChild(hint);
    return;
  }
  habits.forEach(function(habit, idx) {
    var item = document.createElement('div');
    item.className = 'habit-item';

    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'habit-check';
    cb.id = 'hc-' + idx;

    var body = document.createElement('div');
    body.className = 'habit-body';
    body.innerHTML =
      '<div class="habit-title">' + esc(habit.title) + '</div>' +
      (habit.freq ? '<div class="habit-freq">' + esc(habit.freq) + '</div>' : '');

    var del = document.createElement('button');
    del.className = 'habit-del';
    del.textContent = '✕';
    del.title = '刪除';
    del.dataset.idx = idx;
    del.addEventListener('click', function() {
      var i = parseInt(this.dataset.idx);
      familyData._family_habits.splice(i, 1);
      renderHabits();
    });

    item.appendChild(cb);
    item.appendChild(body);
    item.appendChild(del);
    list.appendChild(item);
  });
}

// ── Add habit ──
document.getElementById('addHabitBtn').addEventListener('click', function() {
  var title = document.getElementById('new-habit-title').value.trim();
  if (!title) { showToast('請輸入習慣名稱', 'error'); return; }
  var freq = document.getElementById('new-habit-freq').value.trim();
  if (!familyData._family_habits) familyData._family_habits = [];
  familyData._family_habits.push({ title: title, freq: freq });
  document.getElementById('new-habit-title').value = '';
  document.getElementById('new-habit-freq').value = '';
  renderHabits();
});

document.getElementById('new-habit-title').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('addHabitBtn').click();
});

// ── Save habits ──
document.getElementById('saveHabitsBtn').addEventListener('click', function() {
  var btn = document.getElementById('saveHabitsBtn');
  btn.disabled = true;
  saveData('habits', function() { btn.disabled = false; });
});

// ── API: save ──
function saveData(context, callback) {
  var payload = JSON.parse(JSON.stringify(familyData));
  if (!payload.summary) payload.summary = {};
  payload.summary.last_updated = new Date().toISOString();
  fetch(API + '/api/family-data', {
    method: 'POST',
    headers: HEADERS,
    body: JSON.stringify(payload),
    cache: 'no-store'
  })
  .then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function() {
    familyData = payload;
    document.getElementById('lastUpdated').textContent = '更新：' + payload.summary.last_updated.slice(0, 10);
    if (context) showToast('已儲存 ✓', 'success');
    if (callback) callback();
  })
  .catch(function(e) {
    showToast('❌ 儲存失敗', 'error');
    console.error('[family-dashboard] save:', e);
    if (callback) callback();
  });
}

// ── API: load ──
function loadData() {
  document.getElementById('lastUpdated').textContent = '載入中…';
  fetch(API + '/api/family-data?t=' + Date.now(), { cache: 'no-store', headers: GET_HEADERS })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(d) {
      familyData = d;
      if (!familyData._family_habits) {
        familyData._family_habits = DEFAULT_HABITS.map(function(h) { return { title: h.title, freq: h.freq }; });
      }
      if (!familyData._family_tasks) familyData._family_tasks = [];
      var lu = (familyData.summary && familyData.summary.last_updated) || familyData.last_updated || '—';
      document.getElementById('lastUpdated').textContent = '更新：' + lu.slice(0, 10);
      renderTasks();
      renderMembers();
      renderHabits();
    })
    .catch(function(e) {
      familyData = {
        _family_tasks: [],
        _family_habits: DEFAULT_HABITS.map(function(h) { return { title: h.title, freq: h.freq }; })
      };
      document.getElementById('lastUpdated').textContent = '⚠ 離線模式';
      console.error('[family-dashboard] load:', e);
      renderTasks();
      renderMembers();
      renderHabits();
    });
}

document.getElementById('refreshBtn').addEventListener('click', loadData);
loadData();
</script>
</body>
</html>
