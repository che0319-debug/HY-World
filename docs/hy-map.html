<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HY World — 等距地圖</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #2a5590;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
  }
  canvas { display: block; }
  #back-link {
    margin-top: 14px;
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    text-decoration: none;
    letter-spacing: 1px;
    transition: color 0.15s;
  }
  #back-link:hover { color: rgba(255,255,255,0.75); }
</style>
</head>
<body>
<canvas id="map"></canvas>
<a id="back-link" href="index.html">← 返回 HY World</a>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// Geometry — tune SCALE here if map is too large or too small
// ═══════════════════════════════════════════════════════════════════════════
var SCALE    = 0.28;
var TILE_W   = 985  * SCALE;   // scaled diamond width
var TILE_H   = 492  * SCALE;   // scaled diamond height (2:1 iso)
var ANCHOR_X = 512  * SCALE;   // anchor offset x within scaled PNG
var ANCHOR_Y = 1003 * SCALE;   // anchor offset y — bottom-tip of diamond
var IMG_S    = 1024 * SCALE;   // full scaled PNG size

// Canvas
var CW = 1200, CH = 800;

// Map origin: OX/OY are the screen coords of the ANCHOR of cell (0,0).
// Setting both to CW/2, CH/2 centres the 3×3 grid on the canvas
// (symmetric extent ≈ ±TILE_W + ANCHOR_X horizontally, ±ANCHOR_Y vertically).
var OX = CW / 2;
var OY = CH / 2;

// ═══════════════════════════════════════════════════════════════════════════
// Helpers
// ═══════════════════════════════════════════════════════════════════════════
function isoXY(gx, gy) {
  return {
    x: OX + (gx - gy) * (TILE_W / 2),
    y: OY + (gx + gy) * (TILE_H / 2)
  };
}

// Draw any tile or sprite: anchor at (512,1003) in source PNG maps to isoXY.
function drawAt(ctx, img, gx, gy) {
  var p = isoXY(gx, gy);
  ctx.drawImage(img, p.x - ANCHOR_X, p.y - ANCHOR_Y, IMG_S, IMG_S);
}

// ═══════════════════════════════════════════════════════════════════════════
// Map layout  [gx, gy, key]
// ═══════════════════════════════════════════════════════════════════════════
var GRID = [
  [0, 0, 'tile_grass'],
  [1, 0, 'tile_grass'],
  [2, 0, 'tile_grass'],
  [0, 1, 'tile_grass'],
  [1, 1, 'garage'],      // centre — self-contained base, no underlay needed
  [2, 1, 'tile_grass'],
  [0, 2, 'tile_plot'],
  [1, 2, 'tile_grass'],
  [2, 2, 'tile_plot']
];

// HY character position
var CHAR_GX = 2, CHAR_GY = 1;

// ═══════════════════════════════════════════════════════════════════════════
// Image loading (road_* not used in this version)
// ═══════════════════════════════════════════════════════════════════════════
var BASE = 'assets/tiles/';
var KEYS = ['garage', 'tile_plot', 'tile_grass', 'hy_stand', 'hy_walk'];
var imgs = {};

function loadAll() {
  return Promise.all(KEYS.map(function(k) {
    return new Promise(function(resolve, reject) {
      var img = new Image();
      img.onload  = function() { imgs[k] = img; resolve(); };
      img.onerror = function() { reject(new Error('Load failed: ' + k + '.png')); };
      img.src = BASE + k + '.png';
    });
  }));
}

// ═══════════════════════════════════════════════════════════════════════════
// World status  (null = pending, 'overdue' | 'busy' | 'idle')
// ═══════════════════════════════════════════════════════════════════════════
var worldState = null;
var charFrame  = 0;

// ═══════════════════════════════════════════════════════════════════════════
// Render
// ═══════════════════════════════════════════════════════════════════════════
function render(ctx) {
  ctx.clearRect(0, 0, CW, CH);

  // Painter's algorithm: sort by gx+gy ascending (back → front).
  // Tiebreak by gx so left cells are drawn before right cells at same depth.
  var sorted = GRID.slice().sort(function(a, b) {
    var d = (a[0] + a[1]) - (b[0] + b[1]);
    return d !== 0 ? d : a[0] - b[0];
  });

  for (var i = 0; i < sorted.length; i++) {
    drawAt(ctx, imgs[sorted[i][2]], sorted[i][0], sorted[i][1]);
  }

  // Character: animate only when busy
  var sprite = (worldState === 'busy' && charFrame === 1) ? imgs.hy_walk : imgs.hy_stand;
  drawAt(ctx, sprite, CHAR_GX, CHAR_GY);

  // Status icon above character's head
  var icon = worldState === 'overdue' ? '⚠️' :
             worldState === 'busy'    ? '📋' :
             worldState === 'idle'    ? '☕' : '';
  if (icon) {
    var p = isoXY(CHAR_GX, CHAR_GY);
    ctx.font = Math.round(IMG_S * 0.35) + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(icon, p.x, p.y - ANCHOR_Y - IMG_S * 0.1);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// Bootstrap
// ═══════════════════════════════════════════════════════════════════════════
var canvas = document.getElementById('map');
canvas.width  = CW;
canvas.height = CH;
var ctx = canvas.getContext('2d');

// Loading hint
ctx.fillStyle = 'rgba(255,255,255,0.18)';
ctx.font = '13px Courier New, monospace';
ctx.textAlign = 'center';
ctx.textBaseline = 'alphabetic';
ctx.fillText('載入素材中…', CW / 2, CH / 2);

loadAll()
  .then(function() {
    render(ctx);
    setInterval(function() {
      charFrame = (worldState === 'busy') ? 1 - charFrame : 0;
      render(ctx);
    }, 500);

    // Non-blocking fetch — map renders first, state applied when ready
    fetch('https://telegram-bot-t82n.onrender.com/api/world-status')
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data) {
        var s = data.state;
        worldState = (s === 'overdue' || s === 'busy' || s === 'idle') ? s : 'idle';
        render(ctx);
      })
      .catch(function(err) {
        console.warn('[hy-map] world-status fetch failed:', err);
      });
  })
  .catch(function(err) {
    ctx.clearRect(0, 0, CW, CH);
    ctx.fillStyle = '#ff7755';
    ctx.font = '13px Courier New, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('❌ ' + err.message, 20, 40);
    console.error('[hy-map]', err);
  });
</script>
</body>
</html>
