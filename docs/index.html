<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HY World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #2a5590;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #game-container {
      position: relative;
    }

    /* ── World canvas ─────────────────────────────────── */
    #world-canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #68b050;
    }

    /* ── Login overlay ────────────────────────────────── */
    #login-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
    }
    #login-overlay.hidden { display: none; }

    #clear-login {
      position: absolute;
      top: 12px; right: 14px;
      color: #33335a;
      font-size: 10px;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      font-family: inherit;
      z-index: 12;
    }
    #clear-login:hover { color: #7777aa; }

    #login-canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* ── Login form (HTML, layered over canvas) ─────── */
    #login-form {
      position: absolute;
      top: 56.25%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 11;
      width: 260px;
    }

    #login-title {
      color: #6688cc;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    #pw-input {
      width: 220px;
      background: #07071a;
      border: 2px solid #3a3a7a;
      color: #aaccff;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      padding: 8px 14px;
      text-align: center;
      letter-spacing: 6px;
      outline: none;
      display: block;
    }
    #pw-input:focus {
      border-color: #6666cc;
      box-shadow: 0 0 8px rgba(80,80,200,0.4);
    }
    #pw-input::placeholder {
      letter-spacing: 2px;
      font-size: 11px;
      color: #334;
    }

    #login-btn {
      background: #0e0e2e;
      border: 2px solid #5555aa;
      color: #8899cc;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 8px 28px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    #login-btn:hover {
      background: #1a1a44;
      border-color: #9999ee;
      color: #ccd4ff;
    }
    #login-btn:active {
      background: #2a2a66;
    }

    /* ── Shake animation ─────────────────────────────── */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15%       { transform: translateX(-9px); }
      35%       { transform: translateX(9px); }
      55%       { transform: translateX(-6px); }
      75%       { transform: translateX(6px); }
      90%       { transform: translateX(-3px); }
    }
    #pw-input.shake {
      animation: shake 0.42s ease;
      border-color: #cc4444;
      box-shadow: 0 0 8px rgba(200,50,50,0.5);
    }

    /* ── Indoor scene overlay ────────────────────────── */
    #scene-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #scene-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    #scene-canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* Must be explicit: pointer-events:none on parent does NOT cascade to children in HTML */
      pointer-events: none;
    }
    #scene-overlay.active #scene-canvas { pointer-events: auto; }

    #back-btn {
      position: absolute;
      top: 12px; left: 12px;
      background: #222233;
      color: #aaa;
      border: 1px solid #444;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
      z-index: 6;
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.2s 0.2s, transform 0.2s 0.2s;
      pointer-events: none;
    }
    #back-btn:hover { background: #333355; color: #fff; }
    #scene-overlay.active #back-btn {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    /* ── Dashboard full-screen modal ─────────────────── */
    #dashboard-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0d1117;
    }
    #dashboard-modal-close {
      position: absolute;
      top: 12px; right: 12px;
      z-index: 10000;
      padding: 8px 16px;
      background: #1f6feb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Courier New', monospace;
    }
    #dashboard-modal-close:hover { background: #388bfd; }
    #dashboard-modal iframe {
      width: 100%; height: 100%; border: none;
    }
  </style>
</head>
<body>
  <div id="game-container">

    <!-- World map -->
    <canvas id="world-canvas" width="680" height="480"></canvas>

    <!-- Indoor scene overlay -->
    <div id="scene-overlay">
      <canvas id="scene-canvas" width="680" height="480"></canvas>
      <button id="back-btn">← 返回地圖</button>
    </div>

    <!-- Dashboard full-screen modal -->
    <div id="dashboard-modal">
      <button id="dashboard-modal-close">✕ 關閉</button>
      <iframe id="dashboard-modal-iframe" src=""></iframe>
    </div>

    <!-- Login overlay -->
    <div id="login-overlay">
      <button id="clear-login">清除登入狀態</button>
      <canvas id="login-canvas" width="680" height="480"></canvas>

      <!-- HTML form layered over canvas -->
      <div id="login-form">
        <div id="login-title">HY · WORLD</div>
        <input
          type="password"
          id="pw-input"
          placeholder="輸入密碼"
          autocomplete="off"
          spellcheck="false"
        >
        <button id="login-btn">▶ 進入 HY World</button>
      </div>
    </div>

  </div>

  <!-- Engine -->
  <script src="sprites/characters.js"></script>
  <script src="engine/api.js?v=6"></script>
  <script src="engine/character.js?v=6"></script>
  <script src="engine/login.js?v=6"></script>
  <script src="engine/world.js?v=6"></script>

  <!-- Scenes -->
  <script src="scenes/_base.js?v=6"></script>
  <script src="scenes/construction.js?v=6"></script>
  <script src="scenes/home.js?v=6"></script>
  <script src="scenes/hq.js?v=6"></script>
  <script src="scenes/itri.js?v=6"></script>

  <!-- Bootstrap -->
  <script>
    // ── Dashboard modal ────────────────────────────────
    var _dashModalCloseCallback = null;

    window.openDashboardModal = function(url, onClose) {
      _dashModalCloseCallback = onClose || null;
      document.getElementById('dashboard-modal-iframe').src = url;
      document.getElementById('dashboard-modal').style.display = 'block';
      document.body.style.overflow = 'hidden';
    };

    window.closeDashboardModal = function() {
      document.getElementById('dashboard-modal').style.display = 'none';
      document.getElementById('dashboard-modal-iframe').src = '';
      document.body.style.overflow = '';
      if (_dashModalCloseCallback) { _dashModalCloseCallback(); _dashModalCloseCallback = null; }
    };

    document.getElementById('dashboard-modal-close').addEventListener('click', window.closeDashboardModal);

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && document.getElementById('dashboard-modal').style.display === 'block') {
        window.closeDashboardModal();
      }
    });

    window.PASSWORD = 'hy2025';  // ← 請自行修改密碼

    function applyScale() {
      const scale = Math.max(1, Math.min(
        Math.floor(window.innerWidth  / 680),
        Math.floor(window.innerHeight / 480)
      ));
      const cw = 680 * scale, ch = 480 * scale;
      const container = document.getElementById('game-container');
      container.style.width  = cw + 'px';
      container.style.height = ch + 'px';
      ['world-canvas', 'login-canvas', 'scene-canvas'].forEach(function(id) {
        const el = document.getElementById(id);
        if (el) { el.style.width = cw + 'px'; el.style.height = ch + 'px'; }
      });
    }
    window.addEventListener('resize', applyScale);
    applyScale();

    window.addEventListener('DOMContentLoaded', () => {
      const overlay    = document.getElementById('login-overlay');
      const clearBtn   = document.getElementById('clear-login');
      const backBtn    = document.getElementById('back-btn');
      const sceneOverlay = document.getElementById('scene-overlay');

      clearBtn.addEventListener('click', () => {
        localStorage.removeItem('hy_auth');
        LoginScreen.init();
      });

      backBtn.addEventListener('click', () => {
        World.resume();
      });

      if (localStorage.getItem('hy_auth') === 'ok') {
        overlay.classList.add('hidden');
        World.init();
      } else {
        LoginScreen.init();
      }
    });
  </script>
</body>
</html>
