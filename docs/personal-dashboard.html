<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HY 個人控制中心</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #07071a;
      color: #aaccff;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ── */
    #header {
      background: #0c0c28;
      border-bottom: 2px solid #1e2a55;
      padding: 10px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    #header .logo { font-size: 26px; line-height: 1; }
    #header .title { flex: 1; }
    #header .title h1 { font-size: 17px; color: #88bbff; font-weight: bold; }
    #header .title .sub { font-size: 11px; color: #3a5577; margin-top: 2px; }
    #last-updated { font-size: 11px; color: #3a5577; white-space: nowrap; }

    .btn {
      background: #111132;
      border: 1px solid #2a3a66;
      color: #88aaff;
      padding: 6px 14px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      border-radius: 4px;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: #1a1a44; border-color: #5577bb; color: #aaccff; }
    .btn.primary { background: #152a55; border-color: #3a66bb; color: #77bbff; }
    .btn.primary:hover { background: #1c3566; border-color: #4488dd; }

    /* ── Tabs ── */
    #tabs {
      display: flex;
      background: #090918;
      border-bottom: 1px solid #141430;
      padding: 0 24px;
    }
    .tab-btn {
      padding: 9px 20px;
      cursor: pointer;
      border: none;
      background: none;
      color: #556688;
      font-family: inherit;
      font-size: 13px;
      border-bottom: 2px solid transparent;
      transition: color 0.15s;
    }
    .tab-btn:hover { color: #99bbdd; }
    .tab-btn.active { color: #88ccff; border-bottom-color: #3a88ee; }

    /* ── Tab panels ── */
    .tab-panel { display: none; padding: 20px 28px 40px; }
    .tab-panel.active { display: block; }

    /* ── Cards ── */
    .card {
      background: #0c0c28;
      border: 1px solid #1a2244;
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 14px;
    }
    .card h3 {
      font-size: 12px;
      color: #5577aa;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #141a33;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Form fields ── */
    .field { margin-bottom: 10px; }
    .field label {
      display: block;
      font-size: 11px;
      color: #556688;
      margin-bottom: 4px;
    }
    .field input[type="number"],
    .field input[type="text"],
    .field input[type="date"],
    .field textarea {
      background: #07071a;
      border: 1px solid #1c2a44;
      color: #aaccff;
      font-family: inherit;
      font-size: 13px;
      padding: 6px 10px;
      width: 100%;
      outline: none;
      border-radius: 3px;
    }
    .field input:focus, .field textarea:focus {
      border-color: #3a77cc;
      box-shadow: 0 0 4px rgba(58,119,204,0.25);
    }
    .field textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
    .field input[type="number"] { width: 160px; }
    .field input[type="date"]   { width: 190px; }

    .row { display: flex; gap: 20px; flex-wrap: wrap; }
    .row .field { flex: 1; min-width: 180px; }

    /* ── List items ── */
    .list-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }
    .list-item input {
      flex: 1;
      background: #07071a;
      border: 1px solid #1c2a44;
      color: #aaccff;
      font-family: inherit;
      font-size: 13px;
      padding: 5px 9px;
      outline: none;
      border-radius: 3px;
    }
    .list-item input:focus { border-color: #3a77cc; }
    .list-item input.date-col { flex: 0 0 155px; }

    .del-btn {
      background: none;
      border: 1px solid #3a1a1a;
      color: #774444;
      cursor: pointer;
      padding: 3px 7px;
      font-size: 11px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .del-btn:hover { background: #1e0e0e; color: #cc5555; border-color: #662222; }

    .add-btn {
      background: none;
      border: 1px dashed #1e3322;
      color: #446655;
      cursor: pointer;
      padding: 4px 12px;
      font-size: 12px;
      border-radius: 3px;
      margin-top: 5px;
      display: inline-block;
    }
    .add-btn:hover { background: #0e1a11; color: #77aa88; border-color: #336644; }

    /* ── Exercise +1 ── */
    .exercise-btn {
      background: #0e2218;
      border: 1px solid #2a5535;
      color: #55bb77;
      padding: 6px 14px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      border-radius: 4px;
      margin-top: 6px;
      display: block;
    }
    .exercise-btn:hover { background: #163322; border-color: #44aa66; }
    .exercise-btn:active { background: #0a1a10; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      top: 14px; right: 20px;
      padding: 9px 18px;
      border-radius: 4px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 200;
    }
    #toast.show { opacity: 1; }
    #toast.ok  { background: #0e2218; border: 1px solid #2a6644; color: #55ee88; }
    #toast.err { background: #22100e; border: 1px solid #664433; color: #ee6644; }
  </style>
</head>
<body>

<div id="header">
  <div class="logo">🧑‍💻</div>
  <div class="title">
    <h1>HY 個人控制中心</h1>
    <div class="sub">Personal Data Hub</div>
  </div>
  <span id="last-updated">載入中…</span>
  <button class="btn" id="refresh-btn">↻ 重新整理</button>
  <button class="btn primary" id="save-btn">✓ 儲存</button>
</div>

<div id="tabs">
  <button class="tab-btn active" data-tab="health">💪 健康</button>
  <button class="tab-btn" data-tab="finance">💰 財務</button>
  <button class="tab-btn" data-tab="leisure">🎉 休閒</button>
  <button class="tab-btn" data-tab="growth">📚 成長</button>
</div>

<!-- 健康 -->
<div id="tab-health" class="tab-panel active">
  <div class="card">
    <h3>運動追蹤</h3>
    <div class="row">
      <div class="field">
        <label>本週運動次數</label>
        <input type="number" id="exercise-count" min="0" max="21">
        <button class="exercise-btn" id="exercise-add">今天運動了 +1</button>
      </div>
      <div class="field">
        <label>週運動目標（次）</label>
        <input type="number" id="exercise-target" min="0" max="21">
      </div>
    </div>
  </div>
  <div class="card">
    <h3>健康指標</h3>
    <div class="row">
      <div class="field">
        <label>平均睡眠時數（小時）</label>
        <input type="number" id="sleep-avg" min="0" max="24" step="0.1">
      </div>
      <div class="field">
        <label>上次體檢日期</label>
        <input type="date" id="last-checkup">
      </div>
    </div>
  </div>
</div>

<!-- 財務 -->
<div id="tab-finance" class="tab-panel">
  <div class="card">
    <h3>投資組合</h3>
    <div class="field">
      <label>備註 / 持倉說明</label>
      <textarea id="investment-portfolio" rows="5"></textarea>
    </div>
  </div>
  <div class="card">
    <h3>儲蓄目標</h3>
    <div class="row">
      <div class="field">
        <label>月儲蓄目標（元）</label>
        <input type="number" id="monthly-saving-target" min="0">
      </div>
      <div class="field">
        <label>本月已存（元）</label>
        <input type="number" id="this-month-saved" min="0">
      </div>
    </div>
  </div>
</div>

<!-- 休閒 -->
<div id="tab-leisure" class="tab-panel">
  <div class="card">
    <h3>餐廳探訪</h3>
    <div class="field" style="margin-bottom:14px">
      <label>本季目標家數</label>
      <input type="number" id="restaurant-target" min="0">
    </div>
    <div class="field">
      <label>本季已訪餐廳（名稱 ／ 日期）</label>
      <div id="restaurant-list"></div>
      <button class="add-btn" id="add-restaurant">+ 新增餐廳</button>
    </div>
  </div>
  <div class="card">
    <h3>旅遊</h3>
    <div class="row">
      <div class="field">
        <label>本季旅遊目的地</label>
        <input type="text" id="travel-destination">
      </div>
      <div class="field">
        <label>本季旅遊目標次數</label>
        <input type="number" id="travel-target" min="0">
      </div>
    </div>
  </div>
</div>

<!-- 成長 -->
<div id="tab-growth" class="tab-panel">
  <div class="card">
    <h3>學習焦點</h3>
    <div class="field">
      <label>當前學習焦點</label>
      <input type="text" id="current-focus">
    </div>
  </div>
  <div class="card">
    <h3>進行中技能</h3>
    <div id="skills-list"></div>
    <button class="add-btn" id="add-skill">+ 新增技能</button>
  </div>
  <div class="card">
    <h3>本季閱讀書單</h3>
    <div id="books-list"></div>
    <button class="add-btn" id="add-book">+ 新增書目</button>
  </div>
</div>

<div id="toast"></div>

<script>
  var API    = 'https://telegram-bot-t82n.onrender.com';
  var SECRET = '950157secret';
  var HEADERS = { 'Content-Type': 'application/json', 'X-Secret': SECRET };

  var state = {};

  // ── Tabs ──
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ── Toast ──
  function showToast(msg, ok) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + (ok ? 'ok' : 'err');
    setTimeout(function() { t.className = ''; }, 2200);
  }

  // ── Fill form ──
  function fillForm(d) {
    state = d;
    var h  = d.health   || {};
    var f  = d.finance  || {};
    var l  = d.leisure  || {};
    var g  = d.growth   || {};
    var lr = (l.restaurant) || {};
    var lt = (l.travel)     || {};

    sv('exercise-count',         h.this_week_exercise_count);
    sv('exercise-target',        h.weekly_exercise_target);
    sv('sleep-avg',              h.sleep_avg_this_week);
    sv('last-checkup',           h.last_checkup);

    sv('investment-portfolio',   f.investment_portfolio);
    sv('monthly-saving-target',  f.monthly_saving_target);
    sv('this-month-saved',       f.this_month_saved);

    sv('restaurant-target',      lr.quarterly_target);
    renderRestaurantList(lr.this_quarter_visited || []);
    sv('travel-destination',     lt.this_quarter_destination);
    sv('travel-target',          lt.quarterly_target);

    sv('current-focus',          g.current_focus);
    renderStringList('skills-list', g.skills_in_progress || []);
    renderStringList('books-list',  g.books_this_quarter  || []);

    var lu = (d.summary && d.summary.last_updated) || d.last_updated || '—';
    document.getElementById('last-updated').textContent = '更新：' + lu.slice(0,10);
  }

  function sv(id, val) {
    var el = document.getElementById(id);
    if (!el || val === undefined || val === null) return;
    el.value = val;
  }

  // ── Restaurant list ──
  function renderRestaurantList(items) {
    var list = document.getElementById('restaurant-list');
    list.innerHTML = '';
    items.forEach(function(item) {
      list.appendChild(makeRestaurantRow(item.name || '', item.date || ''));
    });
  }
  function makeRestaurantRow(name, date) {
    var row = document.createElement('div');
    row.className = 'list-item';
    var ni = input('text', name, '餐廳名稱');
    var di = input('date', date, '');
    di.className = 'date-col';
    var del = delBtn(row);
    row.appendChild(ni); row.appendChild(di); row.appendChild(del);
    return row;
  }
  document.getElementById('add-restaurant').addEventListener('click', function() {
    document.getElementById('restaurant-list').appendChild(makeRestaurantRow('', ''));
  });

  // ── Generic string list ──
  function renderStringList(listId, items) {
    var list = document.getElementById(listId);
    list.innerHTML = '';
    items.forEach(function(val) {
      list.appendChild(makeStringRow(val));
    });
  }
  function makeStringRow(val) {
    var row = document.createElement('div');
    row.className = 'list-item';
    var inp = input('text', val, '輸入內容…');
    row.appendChild(inp);
    row.appendChild(delBtn(row));
    return row;
  }
  document.getElementById('add-skill').addEventListener('click', function() {
    document.getElementById('skills-list').appendChild(makeStringRow(''));
  });
  document.getElementById('add-book').addEventListener('click', function() {
    document.getElementById('books-list').appendChild(makeStringRow(''));
  });

  // ── Helpers ──
  function input(type, val, ph) {
    var el = document.createElement('input');
    el.type = type; el.value = val || ''; el.placeholder = ph || '';
    return el;
  }
  function delBtn(row) {
    var b = document.createElement('button');
    b.className = 'del-btn'; b.textContent = '✕';
    b.onclick = function() { row.remove(); };
    return b;
  }

  // ── Collect state from DOM ──
  function collectState() {
    var d = JSON.parse(JSON.stringify(state));

    var h = d.health = d.health || {};
    h.this_week_exercise_count = numVal('exercise-count');
    h.weekly_exercise_target   = numVal('exercise-target');
    h.sleep_avg_this_week      = floatVal('sleep-avg');
    h.last_checkup             = strVal('last-checkup');

    var f = d.finance = d.finance || {};
    f.investment_portfolio  = strVal('investment-portfolio');
    f.monthly_saving_target = numVal('monthly-saving-target');
    f.this_month_saved      = numVal('this-month-saved');

    var l  = d.leisure       = d.leisure      || {};
    var lr = l.restaurant    = l.restaurant   || {};
    var lt = l.travel        = l.travel       || {};
    lr.quarterly_target       = numVal('restaurant-target');
    lr.this_quarter_visited   = readRestaurantList();
    lt.this_quarter_destination = strVal('travel-destination');
    lt.quarterly_target         = numVal('travel-target');

    var g = d.growth = d.growth || {};
    g.current_focus      = strVal('current-focus');
    g.skills_in_progress = readStringList('skills-list');
    g.books_this_quarter = readStringList('books-list');

    if (!d.summary) d.summary = {};
    d.summary.last_updated = new Date().toISOString();
    return d;
  }

  function numVal(id)   { return parseInt(document.getElementById(id).value, 10) || 0; }
  function floatVal(id) { return parseFloat(document.getElementById(id).value) || 0; }
  function strVal(id)   { return document.getElementById(id).value; }

  function readRestaurantList() {
    var items = [];
    document.querySelectorAll('#restaurant-list .list-item').forEach(function(row) {
      var ins = row.querySelectorAll('input');
      var name = ins[0] ? ins[0].value.trim() : '';
      var date = ins[1] ? ins[1].value : '';
      if (name) items.push({ name: name, date: date });
    });
    return items;
  }
  function readStringList(id) {
    var items = [];
    document.querySelectorAll('#' + id + ' .list-item input').forEach(function(inp) {
      if (inp.value.trim()) items.push(inp.value.trim());
    });
    return items;
  }

  // ── Exercise +1 ──
  document.getElementById('exercise-add').addEventListener('click', function() {
    var el = document.getElementById('exercise-count');
    el.value = (parseInt(el.value, 10) || 0) + 1;
    if (!state.health) state.health = {};
    if (!Array.isArray(state.health.exercise_history)) state.health.exercise_history = [];
    state.health.exercise_history.push({
      date: new Date().toISOString().slice(0, 10),
      type: 'general'
    });
  });

  // ── Load ──
  function loadData() {
    document.getElementById('last-updated').textContent = '載入中…';
    fetch(API + '/api/personal-data', { headers: { 'X-Secret': SECRET } })
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d) { fillForm(d); })
      .catch(function(e) {
        document.getElementById('last-updated').textContent = '⚠ 載入失敗';
        console.error('[personal-dashboard] load error:', e);
      });
  }

  // ── Save ──
  document.getElementById('save-btn').addEventListener('click', function() {
    var payload = collectState();
    fetch(API + '/api/personal-data', {
      method: 'POST',
      headers: HEADERS,
      body: JSON.stringify(payload)
    })
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function() {
      state = payload;
      var lu2 = payload.summary && payload.summary.last_updated;
      document.getElementById('last-updated').textContent = '更新：' + (lu2 ? lu2.slice(0,10) : '—');
      showToast('✅ 已儲存', true);
    })
    .catch(function(e) {
      showToast('❌ 儲存失敗', false);
      console.error('[personal-dashboard] save error:', e);
    });
  });

  // ── Refresh ──
  document.getElementById('refresh-btn').addEventListener('click', loadData);

  // ── Init ──
  loadData();
</script>
</body>
</html>
